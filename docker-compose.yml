services:

  # ---------------------------
  # PostgreSQL
  # ---------------------------
  postgres:
    image: postgres:15
    container_name: local_postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ---------------------------
  # Client Service
  # ---------------------------
  client-service:
    container_name: client-service
    build: ./client-service
    env_file:
      - .env
    environment:
      PORT: ${CLIENT_PORT}
      USER_SERVICE_URL: http://user-service:${USER_PORT}
      TOKEN_SERVICE_URL: http://token-service:${TOKEN_PORT}
      RBAC_SERVICE_URL: http://rbac-service:${RBAC_PORT}
      USER_ACCESS: http://localhost:${NGINX_PORT}
      DATABASE_URL: ${CLIENT_DATABASE_URL}
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
      JWT_URL_SECRET: ${JWT_URL_SECRET}
    depends_on:
       postgres:
           condition: service_healthy

  # ---------------------------
  # User Service
  # ---------------------------
  user-service:
    container_name: user-service
    build: ./user-service
    env_file:
      - .env
    environment:
      PORT: ${USER_PORT}
      TOKEN_SERVICE_URL: http://token-service:${TOKEN_PORT}
      RBAC_SERVICE_URL: http://rbac-service:${RBAC_PORT}
      DATABASE_URL: ${USER_DATABASE_URL}
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
      JWT_URL_SECRET: ${JWT_URL_SECRET}
    depends_on:
       postgres:
           condition: service_healthy

  # ---------------------------
  # Token Service
  # ---------------------------
  token-service:
    container_name: token-service
    build: ./token-service
    env_file:
      - .env
    environment:
      PORT: ${TOKEN_PORT}
      USER_SERVICE_URL: http://user-service:${USER_PORT}
      DATABASE_URL: ${TOKEN_DATABASE_URL}
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
    depends_on:
       postgres:
           condition: service_healthy

  # ---------------------------
  # RBAC Service
  # ---------------------------
  rbac-service:
    container_name: rbac-service
    build: ./rbac-service
    env_file:
      - .env
    environment:
      PORT: ${RBAC_PORT}
      USER_SERVICE_URL: http://user-service:${USER_PORT}
      TOKEN_SERVICE_URL: http://token-service:${TOKEN_PORT}
      DATABASE_URL: ${RBAC_DATABASE_URL}
      JWT_CLIENT_SECRET: ${JWT_CLIENT_SECRET}
    depends_on:
       postgres:
           condition: service_healthy


  # ---------------------------
  # frontend service
  # ---------------------------
  frontend:
    container_name: frontend
    build: ./frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      PORT: ${FRONTEND_PORT}
      BACKEND_URL: ${BACKEND_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
       client-service:
           condition: service_healthy
       user-service:
           condition: service_healthy
       token-service:
            condition: service_healthy
       rbac-service:
            condition: service_healthy
       nginx:
            condition: service_healthy
  # ---------------------------
  # nginx service
  # ---------------------------
  nginx:
    container_name: nginx-server
    build: ./nginx
    ports:
      - "${NGINX_PORT}:81"
    depends_on:
       client-service:
           condition: service_healthy
       user-service:
           condition: service_healthy
       token-service:
           condition: service_healthy
       rbac-service:
           condition: service_healthy
networks:
  default:
    name: microservices-net

volumes:
  postgres_data:
